<header class="bar">
  <a class="brand" routerLink="/overview" aria-label="RepsRox Analytics home">
    <span class="mark" aria-hidden="true"></span>
    <span class="word">Reps<span>Rox</span></span>
    <span class="sub">Analytics</span>
  </a>
  <nav aria-label="Main">
    @for (item of nav; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{
        item.label
      }}</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
